<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual" />
    <meta name="theme-color" content="#0b1016" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Aetheris — City Builder</title>
    <link rel="icon" type="image/png" href="./assets/branding/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
      <div id="hud" hidden></div>
      <div id="toasts"></div>
      <div id="title-screen" style="background-image: url('./assets/branding/title-splash.jpg')">
        <div class="title-card">
          <img class="logo" src="./assets/branding/logo-aetheris.jpg" alt="Aetheris" />
          <p>Raise a city from the wilds</p>
          <input id="city-input" maxlength="28" placeholder="Name your city" value="Aetheris" />
          <div class="title-actions">
            <button class="primary" id="btn-new">Found City</button>
            <button id="btn-continue" hidden>Continue</button>
          </div>
          <p class="fine">Tap or click to build · two fingers or right-drag to orbit · Primer on first found</p>
        </div>
      </div>
      <div id="boot">Composing the horizon…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
